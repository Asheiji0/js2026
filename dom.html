<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button id="digigigigido" onclick="elso()"></button>
    <button id="hehe" onclick="masodik()"></button>
    <button id="hahaha" onclick="harmadik()"></button>

    <script>
        function elso(){
            document.getElementById("digigigigido").innerHTML="alpaka"
        }
        let darab = 0;      
        let szamlaloFut=false
        function masodik(){
            darab ++;
            document.getElementById("hehe").innerHTML = darab
        }
        function harmadik(){
             if (szamlaloFut===false)
                {szamlaloFut = setInterval(masodik, 1000);      
                }

        }
    </script>
</body>
</html>
