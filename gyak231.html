        <input type="number" id="bekeres1">
        <input type="number" id="bekeres2">
        <button type="button" onclick="szamol()">gomb</button>
        
        <ul id="lista"></ul>

        <script>

            function szamol(){
                let bekertszam1 = document.getElementById("bekeres1").value
                let bekertszam2 = document.getElementById("bekeres2").value
                console.log(bekertszam1,bekertszam2)
                bekertszam1=parseInt(bekertszam1);
                bekertszam2=parseInt(bekertszam2);
                console.log(bekertszam1,bekertszam2)
                let lista = document.getElementById("lista")

                lista.innerHTML=" ";

                for(let i =0; i <= bekertszam1*bekertszam2 ;i++)
            {


                lista.innerHTML+= "<li>" + i + "</li>"
            }
                
            
                

            }
        </script>
