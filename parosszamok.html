
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>asassa</title>
</head>
<body>

    <h3>20 db véletlen szám táblázatban</h3>

    <div>Legnagyobb szám:<span id="span1"></span></div>
    <div>Legkisebb szám:<span id="span2"></span></div>
    <div>Átlag:<span id="span3"></span></div>
    <div>Páros:<span id="span4"></span></div>
    <br><br>
    <table style="border: 1px solid black; border-collapse: collapse;" id="szamok">
        <h2>random</h2>
    </table>
    <table style="border: 1px solid black; border-collapse: collapse;" id="tabla2">
        <h2>paros</h2>
    </table>
    
     <table style="border: 1px solid black; border-collapse: collapse;" id="tabla3">
        <h2>paratlanok</h2>
    </table>


    <table style="border: 1px solid black; border-collapse: collapse;" id="tabla4">
        <h2>héttel osztható:</h2>
    </table>

    <table style="border: 1px solid black; border-collapse: collapse;" id="tabla5">
        <h2>rendezett:</h2>
    </table>


     <table style="border: 1px solid black; border-collapse: collapse;" id="tabla6">
        <h2>rendezetlen:</h2>
    </table>

    <script>

        function random()
        {

            return Math.floor(Math.random() * 100);

        }
        const random2 = [];

        for(let i=1; i<=20; i++)
        {
            random2.push(random());
        }
        console.log(random2);

        for(let i=0; i<random2.length; i++)
        {
            console.log(random2[i]);
            let tabla = "<tr><td>" + random2[i] + "</td></tr>"
            document.getElementById("szamok").innerHTML += tabla;
        }

        //document.getElementById("span1").innerHTML = Math.max(random2);
        //szelso ertek kereses,maximum

        let legnagyobb = -1;
        for(let i=0; i<random2.length;i++)
        {

            if(random2[i]>legnagyobb)
            {

                legnagyobb = random2[i];
                document.getElementById("span1").innerHTML = " "+legnagyobb;
            }

        }

        let legkisebb = 100;
        for(let i=0; i<random2.length;i++)
        {

            if(random2[i]<legkisebb)
            {

                legkisebb = random2[i];
                document.getElementById("span2").innerHTML = " "+legkisebb;
            }

        }


        let osszeg = 0;
      
        for (let i = 0;i < random2.length ;i++)
        {
            osszeg += random2[i] /random2.length;
            document.getElementById("span3").innerHTML = " " +osszeg;
        }


        const parosok = []

        
        const paratlan = []

        const hetes = []
        

        for(let i =0;i<random2.length;i++)
        {

            
            if (random2[i]  % 2 === 0)
            {

                parosok.push (random2[i])
            } else {

                if (random2[i]  % 2 !== 0){
                    paratlan.push (random2[i])
                }

            }
        

        }     
         for(let i=0; i<parosok.length; i++)
        {
            console.log(parosok[i]);
            let tablazat = "<tr><td>" + parosok[i] + "</td></tr>"
            document.getElementById("tabla2").innerHTML += tablazat;
        }

         for(let i=0; i<paratlan.length; i++)
        {
            console.log(paratlan[i]);
            let tablazat3 = "<tr><td>" + paratlan[i] + "</td></tr>"
            document.getElementById("tabla3").innerHTML += tablazat3;
        }


         for(let i =0;i<random2.length;i++)
        {

            
            if (random2[i]  % 7 === 0)
            {

                hetes.push (random2[i])
            
            }

        }     
         for(let i=0; i<random2.length; i++)
        {
            console.log(hetes[i]);
            let tablazat4 = "<tr><td>" + hetes[i] + "</td></tr>"
            document.getElementById("tabla4").innerHTML += tablazat4;
        }

       // random2.sort((a,b)=> b-a);
        //console.log(random2); ezt modositja a tombot
       let rendezett = random2.toSorted((a,b)=> a-b);
        console.log(rendezett);


         for(let i=0; i<rendezett.length; i++)
        {
            console.log(rendezett[i]);
            let tablazatocska = "<tr><td>" + rendezett[i] + "</td></tr>"
            document.getElementById("tabla5").innerHTML += tablazatocska;
        }

        
        let rendezetlen= random2.toSorted((a,b)=> b-a);
        console.log(rendezetlen);


         for(let i=0; i<rendezetlen.length; i++)
        {
            console.log(rendezetlen[i]);
            let tablazatocska2 = "<tr><td>" + rendezetlen[i] + "</td></tr>"
            document.getElementById("tabla6").innerHTML += tablazatocska2;
        }


        
    </script>
    
</body>
</html>

 -legkisebb szam
 -atlag
